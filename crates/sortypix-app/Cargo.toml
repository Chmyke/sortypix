[package]
name = "sortypix-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
sortypix-core = { path = "../sortypix-core" }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp", "tiff"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
kamadak-exif = "0.6"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_Graphics_Imaging", "Win32_Graphics_Gdi", "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

# RENAME_NOREPLACE moves (storage.rs).
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2.189"

[dev-dependencies]
tempfile = "3"
