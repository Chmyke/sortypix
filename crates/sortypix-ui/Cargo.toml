[package]
name = "sortypix-ui"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "sortypix"
path = "src/main.rs"

# Sortypix AI: the same application with the background analysis (src/ai/). The normal
# binary is built without the feature and links nothing of it.
[[bin]]
name = "sortypix-ai"
path = "src/bin/sortypix-ai.rs"
required-features = ["ai"]

[features]
ai = ["dep:sortypix-ai", "dep:serde_json", "dep:windows"]

[dependencies]
sortypix-ai = { path = "../sortypix-ai", optional = true }
# Sortypix AI keeps its own choices in the shared settings file (Settings.extra).
serde_json = { version = "1", optional = true }
raw-window-handle = "0.6.2"
sortypix-core = { path = "../sortypix-core" }
sortypix-app = { path = "../sortypix-app" }
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "glow"] }
image = { version = "0.25.10", default-features = false, features = ["png", "gif", "jpeg"] }

# Sortypix AI: analysis progress on the taskbar button (ai/taskbar.rs); same crate and version
# as sortypix-app, so nothing new is built.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", optional = true, features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell"] }

# Wayland and X11 windows; client-side decorations for compositors without server ones (GNOME).
[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.36.2", default-features = false, features = ["wayland", "x11"] }
winit = { version = "0.30.13", default-features = false, features = ["wayland-csd-adwaita"] }

[dev-dependencies]
tempfile = "3"
